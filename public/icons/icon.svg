<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="MOS Scene Hunt">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d2542"/>
      <stop offset="1" stop-color="#2a3459"/>
    </linearGradient>
    <linearGradient id="pin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd08a"/>
      <stop offset="1" stop-color="#f5a524"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Trigger radius -->
  <circle cx="256" cy="252" r="150" fill="none" stroke="#f5a524" stroke-opacity="0.28" stroke-width="10" stroke-dasharray="18 22"/>
  <circle cx="256" cy="252" r="96" fill="none" stroke="#f5a524" stroke-opacity="0.5" stroke-width="8"/>

  <!-- Location pin -->
  <path fill="url(#pin)"
        d="M256 118c-49 0-89 40-89 89 0 66 89 187 89 187s89-121 89-187c0-49-40-89-89-89zm0 121a32 32 0 1 1 0-64 32 32 0 0 1 0 64z"/>

  <!-- Trail dots leading out of the ring -->
  <circle cx="150" cy="392" r="13" fill="#2ec27e"/>
  <circle cx="196" cy="428" r="10" fill="#2ec27e" fill-opacity="0.72"/>
  <circle cx="366" cy="392" r="13" fill="#2ec27e"/>
  <circle cx="320" cy="428" r="10" fill="#2ec27e" fill-opacity="0.72"/>
</svg>
