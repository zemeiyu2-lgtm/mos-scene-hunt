name: Refresh candidate lockfile

on:
  push:
    branches: ["fix/next16-eslint-gate"]

permissions:
  contents: write
  actions: write

concurrency:
  group: refresh-lockfile-candidate
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/next16-eslint-gate
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Regenerate and commit lockfile
        run: |
          npm install --no-audit --no-fund
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "build: refresh lockfile after removing vulnerable lint plugin"
            git push origin HEAD:fix/next16-eslint-gate
          fi
      - name: Trigger verification for exact updated branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run verify.yml --ref fix/next16-eslint-gate
